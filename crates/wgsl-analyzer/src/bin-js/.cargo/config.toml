[target.wasm32-unknown-emscripten]
# Threads. The shipped rust-std for this target is built with `singlethread: true`
# (no wasm `atomics` feature), so -pthread cannot link against it. Requires
# `cargo +nightly -Z build-std=std,panic_unwind`.
rustflags = [
  "-Ctarget-feature=+atomics,+bulk-memory,+mutable-globals",
  "-Clink-arg=-pthread",
  # links libc++abi, which provides __cpp_exception / _Unwind_* for panic=unwind
  "-Clink-arg=-sDEFAULT_TO_CXX",
  # main() runs on a pthread, leaving the host thread's event loop free to service
  # deferred pthread_create. Without this, main_loop's blocking select! deadlocks
  # the moment anything spawns a thread.
  "-Clink-arg=-sPROXY_TO_PTHREAD=1",
  "-Clink-arg=-sPTHREAD_POOL_SIZE=8",
  "-Clink-arg=-sPTHREAD_POOL_SIZE_STRICT=0",
  # matches STACK_SIZE in crates/wgsl-analyzer/src/bin-js/main.rs
  "-Clink-arg=-sSTACK_SIZE=16MB",
  "-Clink-arg=-sINITIAL_MEMORY=512MB",
  "-Clink-arg=-sMAXIMUM_MEMORY=4GB",
  "-Clink-arg=-sALLOW_MEMORY_GROWTH=1",
  "-Clink-arg=-sEXIT_RUNTIME=1",
  "-Clink-arg=-sWASM_BIGINT=1",
  "-Clink-arg=-sASSERTIONS=1",
  # Module shape for the browser worker: a default-exported async factory
  # instead of a script that auto-runs main() on load.
  "-Clink-arg=-sMODULARIZE=1",
  "-Clink-arg=-sEXPORT_ES6=1",
  "-Clink-arg=-sEXPORT_NAME=createWgslAnalyzer",
  # Seed MEMFS and install Module.stdin before main() runs, then callMain([]).
  "-Clink-arg=-sINVOKE_RUN=0",
  "-Clink-arg=-sEXPORTED_RUNTIME_METHODS=FS,callMain,ccall",
  # postMessage-based LSP transport (see crates/wgsl-analyzer/src/bin-js/emscripten_io.rs).
  # Path is relative to the directory cargo runs the linker from (workspace root).
  "-Clink-arg=--js-library=crates/wgsl-analyzer/bin-js/emscripten-io.js",
  "-Clink-arg=-sEXPORTED_FUNCTIONS=_main,_wa_push",
]
